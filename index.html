<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102d36">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
  <script src="codes.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main class="container">
    <span class="eyebrow">MONEY, MADE SIMPLE</span>
    <h1>Currency converter<span>.</span></h1>
    <p class="intro">A world of currencies. One simple conversion.</p>
    <form>
      <label for="amount">Amount</label>
      <div class="amount"><input id="amount" name="amount" value="1" type="number" min="0" step="any" required inputmode="decimal" placeholder="Enter amount"></div>
      <div class="dropdown">
        <div class="from">
          <label for="from">From</label>
          <div class="select-con"><img alt="" width="32" height="24"><select id="from" name="from"></select></div>
        </div>
        <button class="swap" type="button" aria-label="Swap currencies" title="Swap currencies">&#8646;</button>
        <div class="to">
          <label for="to">To</label>
          <div class="select-con"><img alt="" width="32" height="24"><select id="to" name="to"></select></div>
        </div>
      </div>
      <div class="result" role="status" aria-live="polite" aria-atomic="true">
        <p class="result-label">CONVERTED AMOUNT</p>
        <p class="msg">Loading exchange rate...</p>
        <p class="rate-detail"></p>
      </div>
      <button class="convert" type="submit">Convert currency <span aria-hidden="true">&#8594;</span></button>
    </form>
    <p class="footnote">Daily reference rates. Your bank's rate may differ.</p>
  </main>
</body>
</html>
